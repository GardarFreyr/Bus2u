[build]
  command = "npm run build"
  publish = "dist"

# Demo site: keep it out of search engines
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# SPA fallback for client-side routes (e.g. /ferdir/sudurstrondin)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
